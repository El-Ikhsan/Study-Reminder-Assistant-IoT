[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
framework = arduino, espidf
upload_protocol = esptool
monitor_speed = 115200

; ✨ 1. UKURAN & DENAH MEMORI
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions/rinchan_16mb_littlefs.csv
board_build.filesystem = littlefs

; ✨ 2. THE MAGIC FIX: Flash pakai DIO (Anti Boot-Loop), PSRAM pakai OPI (Anti Buta)
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_opi

; ✨ 3. PSRAM DIAKTIFKAN KEMBALI UNTUK TFT & AUDIO
build_flags = 
    -DBOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -mfix-esp32-psram-cache-issue
    -Wno-error=format-truncation
    -DCONFIG_LITTLEFS_PAGE_SIZE=256
    -I managed_components/joltwallet__littlefs/include
    -D ARDUINO_LOOP_STACK_SIZE=16384

    -D USER_SETUP_LOADED=1
    -D USE_HSPI_PORT=1
    -D ILI9341_DRIVER=1
    -D TFT_SCLK=40
    -D TFT_MOSI=41
    -D TFT_DC=42
    -D TFT_RST=2
    -D TFT_CS=1
    -D TFT_BL=39               
    -D TFT_MISO=47
    -D TFT_BACKLIGHT_ON=HIGH   
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D SPI_FREQUENCY=40000000   

lib_deps = 
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    claws/BH1750 @ ^1.3.0
    bblanchon/ArduinoJson @ ^6.21.3
    links2004/WebSockets @ ^2.4.1
    ESP32Async/ESPAsyncWebServer @ 3.6.0
    ESP32Async/AsyncTCP @ 3.3.2
    bblanchon/ArduinoJson @ ^7.0.4
    esphome/ESP32-audioI2S @ ^2.0.7
    bodmer/TFT_eSPI @ ^2.5.33
    bodmer/TJpg_Decoder @ ^1.1.0
    bitbank2/AnimatedGIF